<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Neon Clash 3D</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b18;font-family:system-ui,sans-serif;color:#fff}
    canvas{display:block}#help{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:rgba(5,7,18,.78);font-size:14px;letter-spacing:.04em;pointer-events:none}
    #message{position:fixed;top:28px;left:50%;transform:translateX(-50%);font-size:34px;font-weight:900;text-shadow:0 3px 20px #000}
  </style>
</head>
<body>
  <div id="message">NEON CLASH</div>
  <div id="help">WASD: Move · Shift: Sprint</div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#171936');
    scene.fog = new THREE.Fog('#171936', 18, 45);

    const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 100);
    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.prepend(renderer.domElement);

    scene.add(new THREE.HemisphereLight('#bcdcff', '#24152e', 2));
    const sun = new THREE.DirectionalLight('#fff2df', 3);
    sun.position.set(-5, 10, 7);
    sun.castShadow = true;
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({color:'#202443', roughness:.75})
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(40, 40, '#6580b9', '#405178');
    grid.position.y = .006;
    scene.add(grid);

    for (const z of [-12, 12]) {
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(24, 4, .25),
        new THREE.MeshStandardMaterial({color:'#202747'})
      );
      wall.position.set(0, 2, z);
      scene.add(wall);
    }
    for (const x of [-12, 12]) {
      const wall = new THREE.Mesh(
        new THREE.BoxGeometry(.25, 4, 24),
        new THREE.MeshStandardMaterial({color:'#202747'})
      );
      wall.position.set(x, 2, 0);
      scene.add(wall);
    }

    function makeCharacter(color) {
      const group = new THREE.Group();
      const suit = new THREE.MeshStandardMaterial({color, roughness:.4, metalness:.35});
      const skin = new THREE.MeshStandardMaterial({color:'#d99a7e'});
      const dark = new THREE.MeshStandardMaterial({color:'#17192b'});

      const torso = new THREE.Mesh(new THREE.CapsuleGeometry(.55, .95, 6, 12), suit);
      torso.position.y = 1.72;
      torso.scale.z = .72;
      group.add(torso);

      const hips = new THREE.Mesh(new THREE.SphereGeometry(.54, 16, 10), dark);
      hips.position.y = .92;
      hips.scale.y = .55;
      group.add(hips);

      const head = new THREE.Mesh(new THREE.CapsuleGeometry(.38, .08, 6, 12), skin);
      head.position.y = 2.72;
      group.add(head);

      for (const side of [-1, 1]) {
        const arm = new THREE.Mesh(new THREE.CapsuleGeometry(.18, .72, 6, 12), suit);
        arm.position.set(side * .78, 1.75, 0);
        arm.rotation.z = side * .12;
        group.add(arm);

        const leg = new THREE.Mesh(new THREE.CapsuleGeometry(.21, .78, 6, 12), dark);
        leg.position.set(side * .31, .38, 0);
        leg.name = side < 0 ? 'leftLeg' : 'rightLeg';
        group.add(leg);
      }

      group.traverse(object => {
        if (object.isMesh) {
          object.castShadow = true;
          object.receiveShadow = true;
        }
      });
      return group;
    }

    const player = makeCharacter('#55d8ff');
    player.position.set(0, 0, 5);
    scene.add(player);

    const keys = new Set();
    let elapsed = 0;

    addEventListener('keydown', event => {
      keys.add(event.code);
      if (['KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight'].includes(event.code)) {
        event.preventEvent?.();
        event.preventDefault();
      }
    });
    addEventListener('keyup', event => keys.delete(event.code));

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), .04);
      elapsed += dt;

      const forward = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
      const right = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);

      if (forward || right) {
        const length = Math.hypot(forward, right);
        const speed = keys.has('ShiftLeft') || keys.has('ShiftRight') ? 7 : 4;
        const dx = right / length;
        const dz = -forward / length;

        player.position.x += dx * speed * dt;
        player.position.z += dz * speed * dt;
        player.position.x = THREE.MathUtils.clamp(player.position.x, -11, 11);
        player.position.z = THREE.MathUtils.clamp(player.position.z, -11, 11);

        player.rotation.y = Math.atan2(dx, dz);
        const walk = Math.sin(elapsed * 12) * .22;
        player.getObjectByName('leftLeg')?.rotation.set(walk, 0, 0);
        player.getObjectByName('rightLeg')?.rotation.set(-walk, 0, 0);
      } else {
        player.getObjectByName('leftLeg')?.rotation.set(0, 0, 0);
        player.getObjectByName('rightLeg')?.rotation.set(0, 0, 0);
      }

      const desiredCamera = new THREE.Vector3(
        player.position.x,
        5.5,
        player.position.z + 8
      );
      camera.position.lerp(desiredCamera, 1 - Math.exp(-dt * 8));
      camera.lookAt(player.position.x, 1.7, player.position.z);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
