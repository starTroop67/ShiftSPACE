<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101225">
  <title>Neon Clash — First-Person Fight</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080a16; color: #f5f7ff; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    body { display: grid; place-items: center; }
    #frame { position: relative; width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); background: #11152b; box-shadow: 0 0 70px #070914; }
    canvas { display: block; width: 100%; height: 100%; }
    #hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); color: #d7ddf6; font-size: clamp(11px, 1.4vw, 15px); text-align: center; text-shadow: 0 2px 6px #000; pointer-events: none; white-space: nowrap; }
  </style>
</head>
<body>
  <main id="frame">
    <canvas id="game" width="1280" height="720" aria-label="First-person fighting game"></canvas>
    <div id="hint">WASD move · Mouse look · F / click punch · Shift / right-click block · Esc unlock mouse</div>
  </main>
  <script>
    'use strict';

    const canvas = document.querySelector('#game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const keys = new Set();
    const arena = 18;
    const player = { x: 0, z: 5, yaw: 0, health: 100, stamina: 100, punch: 0, cooldown: 0, blocking: false, hurt: 0 };
    const enemy = { x: 1.5, z: -5, health: 100, attack: 0, cooldown: 0, hurt: 0, windup: 0, strafe: 1 };
    let mode = 'intro';
    let elapsed = 0;
    let last = performance.now();
    let message = '';
    let messageTime = 0;
    let pointerLocked = false;

    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const distance = () => Math.hypot(enemy.x - player.x, enemy.z - player.z);
    function say(text, duration = 1) { message = text; messageTime = duration; }

    function begin() {
      player.x = 0; player.z = 5; player.yaw = 0; player.health = 100; player.stamina = 100;
      player.punch = 0; player.cooldown = 0; player.hurt = 0; player.blocking = false;
      enemy.x = 1.5; enemy.z = -5; enemy.health = 100; enemy.attack = 0; enemy.cooldown = 0; enemy.hurt = 0; enemy.windup = 0;
      elapsed = 0; mode = 'fight'; say('FIGHT!', 1.3);
    }

    function requestLock() {
      if (canvas.requestPointerLock) canvas.requestPointerLock();
    }
    canvas.addEventListener('click', () => {
      if (mode !== 'fight') { begin(); requestLock(); return; }
      if (!pointerLocked) { requestLock(); return; }
      punch();
    });
    document.addEventListener('pointerlockchange', () => { pointerLocked = document.pointerLockElement === canvas; });
    document.addEventListener('mousemove', event => {
      if (pointerLocked && mode === 'fight') player.yaw += event.movementX * 0.0025;
    });
    document.addEventListener('keydown', event => {
      if (['KeyW','KeyA','KeyS','KeyD','KeyF','Space','ShiftLeft','ShiftRight'].includes(event.code)) event.preventDefault();
      keys.add(event.code);
      if ((mode === 'intro' || mode === 'over') && (event.code === 'Enter' || event.code === 'Space')) begin();
      if (mode === 'fight' && event.code === 'KeyF' && !event.repeat) punch();
    });
    document.addEventListener('keyup', event => keys.delete(event.code));
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('mousedown', event => {
      if (mode !== 'fight') return;
      if (event.button === 2) { player.blocking = true; return; }
      if (event.button === 0 && pointerLocked) punch();
    });
    document.addEventListener('mouseup', event => { if (event.button === 2) player.blocking = false; });

    function punch() {
      if (mode !== 'fight' || player.cooldown > 0) return;
      player.punch = 0.22;
      player.cooldown = 0.48;
      const dx = enemy.x - player.x, dz = enemy.z - player.z;
      const d = Math.hypot(dx, dz);
      const angleToEnemy = Math.atan2(dx, -dz);
      const facing = Math.atan2(Math.sin(angleToEnemy - player.yaw), Math.cos(angleToEnemy - player.yaw));
      if (d < 2.45 && Math.abs(facing) < 0.8) {
        enemy.health = Math.max(0, enemy.health - 13);
        enemy.hurt = 0.25;
        const shove = 0.75;
        enemy.x += Math.sin(angleToEnemy) * shove;
        enemy.z -= Math.cos(angleToEnemy) * shove;
        say('HIT!', 0.45);
      } else {
        say('MISS', 0.35);
      }
    }

    function update(dt) {
      if (mode !== 'fight') return;
      elapsed += dt;
      player.cooldown = Math.max(0, player.cooldown - dt);
      player.punch = Math.max(0, player.punch - dt);
      player.hurt = Math.max(0, player.hurt - dt);
      enemy.hurt = Math.max(0, enemy.hurt - dt);
      enemy.cooldown = Math.max(0, enemy.cooldown - dt);
      enemy.attack = Math.max(0, enemy.attack - dt);
      messageTime = Math.max(0, messageTime - dt);

      const forward = (keys.has('KeyW') ? 1 : 0) - (keys.has('KeyS') ? 1 : 0);
      const side = (keys.has('KeyD') ? 1 : 0) - (keys.has('KeyA') ? 1 : 0);
      player.blocking = keys.has('ShiftLeft') || keys.has('ShiftRight');
      const speed = player.blocking ? 2.0 : 4.0;
      const length = Math.hypot(forward, side) || 1;
      player.x += (Math.sin(player.yaw) * forward + Math.cos(player.yaw) * side) * speed * dt / length;
      player.z += (-Math.cos(player.yaw) * forward + Math.sin(player.yaw) * side) * speed * dt / length;
      player.x = clamp(player.x, -arena, arena);
      player.z = clamp(player.z, -arena, arena);

      // Opponent AI: close the distance, circle a little, then telegraph and attack.
      const dx = player.x - enemy.x, dz = player.z - enemy.z;
      const d = Math.hypot(dx, dz) || 0.001;
      if (enemy.hurt <= 0) {
        if (d > 1.85) {
          const strafe = d < 4.2 ? enemy.strafe * 0.22 : 0;
          enemy.x += (dx / d + (-dz / d) * strafe) * 2.15 * dt;
          enemy.z += (dz / d + (dx / d) * strafe) * 2.15 * dt;
        }
        if (enemy.windup > 0) {
          enemy.windup -= dt;
          if (enemy.windup <= 0) {
            enemy.attack = 0.24;
            enemy.cooldown = 1.15;
            const nowD = distance();
            if (nowD < 2.2 && !player.blocking) {
              player.health = Math.max(0, player.health - 12);
              player.hurt = 0.3;
              say('YOU GOT HIT', 0.65);
            } else if (nowD < 2.2) {
              player.stamina = Math.max(0, player.stamina - 12);
              say('BLOCKED', 0.55);
            }
          }
        } else if (d < 2.5 && enemy.cooldown <= 0) {
          enemy.windup = 0.48;
          enemy.strafe *= -1;
        }
      }
      enemy.x = clamp(enemy.x, -arena, arena);
      enemy.z = clamp(enemy.z, -arena, arena);
      player.stamina = Math.min(100, player.stamina + (player.blocking ? 4 : 15) * dt);

      if (player.health <= 0 || enemy.health <= 0) {
        mode = 'over';
        document.exitPointerLock?.();
      }
    }

    // Convert a world position to screen coordinates using the player's first-person camera.
    function project(x, z) {
      const dx = x - player.x, dz = z - player.z;
      const c = Math.cos(player.yaw), s = Math.sin(player.yaw);
      const side = dx * c + dz * s;
      const depth = dx * s - dz * c;
      if (depth <= 0.12) return null;
      const focal = 600;
      return { x: W / 2 + side * focal / depth, y: H * 0.43 + focal * 1.45 / depth, scale: focal / depth, depth };
    }

    function drawWorld() {
      const sky = ctx.createLinearGradient(0, 0, 0, H * 0.7);
      sky.addColorStop(0, '#11152f'); sky.addColorStop(1, '#43416c');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
      // Distant arena lights.
      for (let i = 0; i < 10; i++) {
        const px = 60 + i * 130;
        ctx.fillStyle = i % 2 ? '#ff527f' : '#55d8ff';
        ctx.globalAlpha = 0.75;
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 20;
        ctx.beginPath(); ctx.arc(px, 210 + (i % 3) * 15, 5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
      const horizon = H * 0.43;
      const floor = ctx.createLinearGradient(0, horizon, 0, H);
      floor.addColorStop(0, '#292b4d'); floor.addColorStop(1, '#101222');
      ctx.fillStyle = floor; ctx.fillRect(0, horizon, W, H - horizon);

      // Perspective floor grid.
      ctx.lineWidth = 2;
      for (let z = -16; z <= 18; z += 2) {
        const a = project(-arena, z), b = project(arena, z);
        if (a && b) {
          const alpha = clamp(0.42 - Math.max(a.depth, b.depth) / 55, 0.06, 0.35);
          ctx.strokeStyle = `rgba(97, 119, 190, ${alpha})`;
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      for (let x = -arena; x <= arena; x += 2) {
        const a = project(x, -arena), b = project(x, arena);
        if (a && b) {
          ctx.strokeStyle = 'rgba(97, 119, 190, .18)';
          ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        }
      }
      // Arena boundary posts.
      for (const x of [-arena, arena]) {
        for (const z of [-arena, arena]) {
          const p = project(x, z);
          if (!p || p.x < -80 || p.x > W + 80) continue;
          const h = p.scale * 0.9;
          ctx.fillStyle = '#303659'; ctx.fillRect(p.x - h * 0.12, p.y - h, h * 0.24, h);
          ctx.fillStyle = '#65dfff'; ctx.fillRect(p.x - h * 0.12, p.y - h, h * 0.24, Math.max(2, h * 0.07));
        }
      }
    }

    function drawEnemy() {
      const p = project(enemy.x, enemy.z);
      if (!p || p.x < -180 || p.x > W + 180) return;
      const scale = clamp(p.scale, 8, 170);
      const height = scale * 1.65;
      const width = height * 0.48;
      const x = p.x, feet = p.y;
      ctx.save();
      if (enemy.hurt > 0) ctx.globalAlpha = 0.6;
      // Shadow
      ctx.fillStyle = 'rgba(0,0,0,.4)';
      ctx.beginPath(); ctx.ellipse(x, feet, width * 0.55, Math.max(3, scale * 0.09), 0, 0, Math.PI * 2); ctx.fill();
      // Legs
      ctx.fillStyle = '#222843';
      ctx.fillRect(x - width * 0.35, feet - height * 0.42, width * 0.27, height * 0.42);
      ctx.fillRect(x + width * 0.08, feet - height * 0.42, width * 0.27, height * 0.42);
      // Torso
      ctx.fillStyle = '#ed426c';
      ctx.beginPath(); ctx.roundRect(x - width * 0.42, feet - height * 0.78, width * 0.84, height * 0.43, width * 0.12); ctx.fill();
      // Head
      ctx.fillStyle = '#f3bd9e';
      ctx.beginPath(); ctx.arc(x, feet - height * 0.9, width * 0.25, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#25192c';
      ctx.beginPath(); ctx.arc(x, feet - height * 0.95, width * 0.26, Math.PI, Math.PI * 2); ctx.fill();
      // Arms and windup tell
      ctx.strokeStyle = '#f3bd9e'; ctx.lineWidth = Math.max(3, width * 0.16); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x - width * 0.32, feet - height * 0.7); ctx.lineTo(x - width * 0.55, feet - height * 0.48);
      ctx.moveTo(x + width * 0.32, feet - height * 0.7);
      if (enemy.windup > 0 || enemy.attack > 0) ctx.lineTo(x + width * 0.68, feet - height * 0.65);
      else ctx.lineTo(x + width * 0.52, feet - height * 0.48);
      ctx.stroke();
      if (enemy.windup > 0) {
        ctx.strokeStyle = 'rgba(255,77,111,.8)'; ctx.lineWidth = Math.max(2, scale * 0.035);
        ctx.beginPath(); ctx.arc(x, feet - height * 0.6, width * 0.8, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }

    function bar(x, y, w, h, value, color, label) {
      ctx.fillStyle = 'rgba(7,9,22,.8)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill();
      ctx.fillStyle = '#363b58'; ctx.beginPath(); ctx.roundRect(x + 4, y + 4, w - 8, h - 8, 5); ctx.fill();
      ctx.fillStyle = color; ctx.beginPath(); ctx.roundRect(x + 4, y + 4, (w - 8) * clamp(value / 100, 0, 1), h - 8, 5); ctx.fill();
      ctx.fillStyle = '#f5f7ff'; ctx.font = '700 17px system-ui'; ctx.textAlign = 'left'; ctx.fillText(label, x, y - 8);
    }

    function drawHUD() {
      bar(38, 48, 350, 28, player.health, '#51d8ff', 'YOU');
      bar(W - 388, 48, 350, 28, enemy.health, '#ff527f', 'OPPONENT');
      bar(38, 101, 200, 15, player.stamina, '#ffc857', 'BLOCK');
      // Crosshair
      const cx = W / 2, cy = H * 0.43;
      ctx.strokeStyle = player.punch > 0 ? '#ffc857' : 'rgba(245,247,255,.82)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx - 11, cy); ctx.lineTo(cx - 4, cy); ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 11, cy); ctx.moveTo(cx, cy - 11); ctx.lineTo(cx, cy - 4); ctx.moveTo(cx, cy + 4); ctx.lineTo(cx, cy + 11); ctx.stroke();
      // First-person fists
      const bob = (keys.has('KeyW') || keys.has('KeyA') || keys.has('KeyS') || keys.has('KeyD')) ? Math.sin(elapsed * 11) * 7 : 0;
      ctx.fillStyle = player.blocking ? '#9a85ff' : '#55d8ff';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 17;
      ctx.beginPath(); ctx.ellipse(430, 665 + bob, 85, 65, -0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(850, 665 - bob, 85, 65, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      if (player.punch > 0) {
        const reach = 120 * (player.punch / 0.22);
        ctx.fillStyle = '#8ff0ff';
        ctx.beginPath(); ctx.ellipse(640, 630 + reach * 0.35, 54, 43, 0, 0, Math.PI * 2); ctx.fill();
      }
      if (player.blocking) {
        ctx.fillStyle = 'rgba(150,133,255,.22)'; ctx.fillRect(0, 0, W, H);
      }
      if (messageTime > 0) {
        ctx.textAlign = 'center'; ctx.font = '900 30px system-ui';
        ctx.fillStyle = '#fff'; ctx.shadowColor = '#101225'; ctx.shadowBlur = 8; ctx.fillText(message, W / 2, 145); ctx.shadowBlur = 0;
      }
    }

    function overlay(title, subtitle, extra = '') {
      ctx.fillStyle = 'rgba(5,7,18,.78)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.fillStyle = '#f5f7ff'; ctx.shadowColor = '#55d8ff'; ctx.shadowBlur = 26;
      ctx.font = '900 72px system-ui'; ctx.fillText(title, W / 2, 285); ctx.shadowBlur = 0;
      ctx.fillStyle = '#d7ddf6'; ctx.font = '700 25px system-ui'; ctx.fillText(subtitle, W / 2, 345);
      if (extra) { ctx.font = '600 19px system-ui'; ctx.fillStyle = '#aeb8dc'; ctx.fillText(extra, W / 2, 405); }
    }

    function draw() {
      drawWorld(); drawEnemy(); drawHUD();
      if (mode === 'intro') overlay('NEON CLASH', 'FIRST-PERSON FIGHTING GAME', 'Click or press Enter to start · Click again to capture mouse', '');
      if (mode === 'over') overlay(enemy.health <= 0 ? 'YOU WIN!' : 'KNOCKED OUT', 'Click or press Enter to fight again', '');
    }

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.04); last = now;
      update(dt); draw(); requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
